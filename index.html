<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — أثر Report Hub</title>
  <link rel="icon" href="assets/logo.jpg">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="login-body">
  <main class="login-box">
    <img class="login-logo" src="assets/logo.jpg" alt="شعار أثر">
    <h1>أثر Report Hub</h1>
    <p class="login-sub">سجّل الدخول لتعبئة تقرير قسمك</p>
    <form id="login-form" autocomplete="on">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" name="email" dir="ltr" autocomplete="username" required>
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" name="password" dir="ltr" autocomplete="current-password" required>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">دخول</button>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Already signed in -> straight to the form.
    if (AtharAuth.getSession()) location.replace('form.html');

    const form = document.getElementById('login-form');
    const err = document.getElementById('login-error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const btn = form.querySelector('button');
      btn.disabled = true;
      try {
        const acc = await AtharAuth.login(form.email.value, form.password.value);
        if (acc) { location.replace('form.html'); return; }
        err.textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
      } catch (ex) {
        err.textContent = 'تعذّر تسجيل الدخول في هذا المتصفح.';
      }
      err.hidden = false;
      btn.disabled = false;
    });
  </script>
</body>
</html>
